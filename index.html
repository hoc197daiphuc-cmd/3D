<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>WebVR Video 360 Degree</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
      #play-btn {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        padding: 15px 30px;
        background-color: #00ec47;
        color: black;
        border: none;
        border-radius: 25px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      }
    </style>
  </head>
  <body style="margin: 0px; overflow: hidden;">

    <button id="play-btn">CHẠM VÀO ĐÂY ĐỂ XEM VIDEO</button>
    
    <!-- Tăng tối đa thời gian chờ tải tài nguyên lên 60 giây (60000ms) -->
    <a-scene vr-mode-ui="enabled: true" crossorigin="anonymous">
      
      <a-assets timeout="60000">
        <!-- Bổ sung thuộc tính preload="auto" tối ưu cho video dung lượng lớn -->
        <video id="video-360" 
               src="./assets/7901377374353.mp4" 
               autoplay="true" 
               loop="true" 
               muted="true"
               preload="auto"
               crossorigin="anonymous" 
               playsinline 
               webkit-playsinline>
        </video>
      </a-assets>
      
      <a-videosphere src="#video-360" rotation="0 -90 0"></a-videosphere>
      
      <a-entity camera look-controls></a-entity>
      
    </a-scene>

    <script>
      const button = document.getElementById('play-btn');
      const video = document.getElementById('video-360');

      button.addEventListener('click', function() {
        video.muted = false;
        video.play().then(() => {
          button.style.display = 'none';
        }).catch(err => {
          console.log("Lỗi phát video:", err);
          video.play();
          button.style.display = 'none';
        });
      });

      document.addEventListener('DOMContentLoaded', () => {
        video.load();
      });
    </script>
  </body>
</html>
